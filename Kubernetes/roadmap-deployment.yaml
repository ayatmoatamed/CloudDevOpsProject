apiVersion: apps/v1
kind: Deployment

metadata:
  name: roadmap-service
  namespace: ivolve

spec:
  replicas: 2

  selector:
    matchLabels:
      app: roadmap-service

  template:
    metadata:
      labels:
        app: roadmap-service

    spec:
      containers:
        - name: roadmap-service
          image: 662371887852.dkr.ecr.us-east-1.amazonaws.com/ivolve-repo:roadmap-service

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: ivolve-config

            - secretRef:
                name: ivolve-secret
